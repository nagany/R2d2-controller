<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>R2-D2 Control Panel</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at center, #26313b 0%, #111820 70%);
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    #controls {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    /* DRIVE PANEL */
    #left {
      flex: 1;
      min-width: 360px;
      background: linear-gradient(145deg, #d9dde0, #8c9499);
      border-radius: 28px;
      padding: 18px;
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.8),
        0 10px 30px rgba(0,0,0,.45);
      position: relative;
      overflow: hidden;
    }

    #left::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 18px solid rgba(255,255,255,.18);
      top: -90px;
      left: -90px;
    }

    .panelTitle {
      color: #17232d;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-align: center;
      margin: 3px 0 12px;
    }

    #connectionPanel {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    #connectButton {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 13px 12px;
      background: linear-gradient(#278bc0, #075b8d);
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.4),
        0 3px 8px rgba(0,0,0,.3);
    }

    #status {
      flex: 1;
      background: #1c252c;
      border-radius: 12px;
      padding: 11px 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #8c969c;
    }

    #status.connected {
      color: #62e0ff;
    }

    /* JOYSTICK */
    #joystickArea {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          #313b43 0%,
          #1b242b 55%,
          #10171c 56%,
          #252f36 68%,
          #0c1216 70%);
      box-shadow:
        inset 0 0 0 5px #59646a,
        inset 0 0 0 12px #161e23,
        0 10px 25px rgba(0,0,0,.45);
    }

    #joystick {
      position: absolute;
      left: 22px;
      top: 22px;
      width: 256px;
      height: 256px;
    }

    #joystick img {
      user-select: none;
      -webkit-user-drag: none;
    }

    #stick1 {
      position: absolute;
      left: 64px;
      top: 64px;
    }

    #stick1 img {
      filter: drop-shadow(0 5px 5px rgba(0,0,0,.5));
    }

    .joystickLabel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #6d7a82;
    }

    #stopButton {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: 180px;
      padding: 13px;
      border: 2px solid #521c20;
      border-radius: 14px;
      background: linear-gradient(#d94b52, #8e1e26);
      color: white;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.35),
        0 4px 10px rgba(0,0,0,.35);
    }

    /* SOUND PANEL */
    #right {
      flex: 1.15;
      min-width: 390px;
      background: linear-gradient(145deg, #1d2932, #0c1217);
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.08),
        0 10px 30px rgba(0,0,0,.5);
      overflow: hidden;
    }

    .soundHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .soundTitle {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .soundSubtitle {
      font-size: 9px;
      color: #6f818d;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    #buttonsDiv {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100% - 60px);
      padding-right: 2px;
    }

    .soundButton {
      min-height: 70px;
      border: 1px solid #3b4a54;
      border-radius: 14px;
      background: linear-gradient(145deg, #293741, #151e24);
      color: #dfe7eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .7px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.07),

      transition: transform .08s, background .08s;
    }

    .soundButton:active {
      transform: scale(.94);
      background: linear-gradient(145deg, #126b96, #0b405a);
      border-color: #55bde8;
    }

    .soundIcon {
      font-size: 23px;
      line-height: 1;
    }

    .soundName {
      white-space: nowrap;
    }

    @media (orientation: portrait) {
      body {
        overflow-y: auto;
      }

      #controls {
        height: auto;
        min-height: 100%;
        flex-direction: column;
      }

      #left,
      #right {
        min-width: 0;
      }

      #left {
        height: 500px;
      }

      #right {
        min-height: 500px;
      }
    }

/* =========================
   BLUETOOTH
   ========================= */

var characteristic;

function connect() {

  navigator.bluetooth.requestDevice({
    filters: [{"name":"w32 ControlHub"}],
    optionalServices: [
      'd9d9e9e0-aa4e-4797-8151-cb41cedaf2ad'
    ]
  })

  .then(device => {
    return device.gatt.connect();
  })

  .then(server => {
    return server.getPrimaryService(
      'd9d9e9e0-aa4e-4797-8151-cb41cedaf2ad'
    );
  })

  .then(async service => {

    characteristic = await service.getCharacteristic(
      "d9d9e9e1-aa4e-4797-8151-cb41cedaf2ad"
    );

  })

  .then(() => {

    console.log('Connected!');

    document.getElementById("status").innerHTML =
      "● CONNECTED";

    document.getElementById("status")
      .classList.add("connected");

    stop();

  })

  .catch(error => {

    console.log(error);

    document.getElementById("status").innerHTML =
      "○ DISCONNECTED";

  });
}


async function writeToChar(value) {

  value = hexToBytes(value);
  value = new Uint8Array(value).buffer;

  if (characteristic) {

    characteristic.writeValue(value)
      .catch(e => {});

  }
}


async function play(sound) {

  try {
    writeToChar(sound);
  }

  catch(error) {
    console.log('Argh! ' + error);
  }

}


async function drive(index) {

  try {

    return await writeToChar(
      driveValues[index]
    );

  }

  catch(error) {

    console.log('Argh! ' + error);

  }

}


async function turn(index) {

  try {

    return await writeToChar(
      turnValues[index]
    );

  }

  catch(error) {

    console.log('Argh! ' + error);

  }

}


async function stop() {

  try {

    y = 31;
    driveAndTurn();

  }

  catch(error) {

    console.log('Argh! ' + error);

  }

}


/* =========================
   UTILS
   ========================= */

function hexToBytes(hex) {

  for (
    var bytes = [],
    c = 0;
    c < hex.length;
    c += 2
  )

    bytes.push(
      parseInt(
        hex.substr(c, 2),
        16
      )
    );

  return bytes;

}

/* =========================
   JOYSTICK
   原版ロジックを維持
   ========================= */

class JoystickController {

  constructor(stickID, maxDistance, deadzone) {

    this.id = stickID;

    let stick =
      document.getElementById(stickID);

    this.dragStart = null;
    this.touchId = null;
    this.active = false;

    this.value = {
      x: 0,
      y: 0
    };

    let self = this;


    function handleDown(event) {

      self.active = true;

      stick.style.transition = '0s';

      event.preventDefault();

      if (event.changedTouches)

        self.dragStart = {
          x: event.changedTouches[0].clientX,
          y: event.changedTouches[0].clientY
        };

      else

        self.dragStart = {
          x: event.clientX,
          y: event.clientY
        };

      if (event.changedTouches)

        self.touchId =
          event.changedTouches[0].identifier;

    }


    function handleMove(event) {

      if (!self.active) return;

      if (!characteristic) return;

      let touchmoveId = null;


      if (event.changedTouches) {

        for (
          let i = 0;
          i < event.changedTouches.length;
          i++
        ) {

          if (
            self.touchId ==
            event.changedTouches[i].identifier
          ) {

            touchmoveId = i;

            event.clientX =
              event.changedTouches[i].clientX;

            event.clientY =
              event.changedTouches[i].clientY;

          }

        }

        if (touchmoveId == null) return;

      }


      const xDiff =
        event.clientX -
        self.dragStart.x;

      const yDiff =
        event.clientY -
        self.dragStart.y;


      const angle =
        Math.atan2(yDiff, xDiff);

      const driveangle =
        Math.atan2(xDiff, -yDiff);


      const distance =
        Math.min(
          maxDistance,
          Math.hypot(xDiff, yDiff)
        );


      const xPosition =
        distance * Math.cos(angle);

      const yPosition =
        distance * Math.sin(angle);


      stick.style.transform =
        `translate3d(${xPosition}px, ${yPosition}px, 0px)`;


      const distance2 =
        (distance < deadzone)
        ? 0
        : maxDistance /
          (maxDistance - deadzone) *
          (distance - deadzone);


      const xPosition2 =
        distance2 * Math.cos(angle);

      const yPosition2 =
        distance2 * Math.sin(angle);


      const xPercent =
        parseFloat(
          (xPosition2 / maxDistance)
          .toFixed(4)
        );

      const yPercent =
        parseFloat(
          (yPosition2 / maxDistance)
          .toFixed(4)
        );


      self.value = {
        x: xPercent,
        y: yPercent
      };


      let xVal;
      let yVal;

      let limit =
        .75 * Math.PI;


      if (
        Math.abs(driveangle) < limit
      ) {

        xVal =
          ((33 - 2) *
          (driveangle + limit)) /
          (2 * limit) + 2;

        yVal =
          ((0 - 31) * distance) /
          64 + 31;

      }

      else {

        xVal = 17;

        yVal =
          ((62 - 31) * distance) /
          64 + 31;

      }


      x = Math.floor(xVal);

      y = Math.floor(yVal);

      throttle(
        () => driveAndTurn()
      );

    }


    function handleUp(event) {

      if (!self.active) return;

      if (
        event.changedTouches &&
        self.touchId !=
        event.changedTouches[0].identifier
      )
        return;


      stick.style.transition = '.2s';

      stick.style.transform =
        `translate3d(0px, 0px, 0px)`;


      self.value = {
        x: 0,
        y: 0
      };

      self.touchId = null;

      self.active = false;

      stop();

    }


    stick.addEventListener(
      'mousedown',
      handleDown
    );

    stick.addEventListener(
      'touchstart',
      handleDown
    );

    document.addEventListener(
      'mousemove',
      handleMove,
      {passive: true}
    );

    document.addEventListener(
      'touchmove',
      handleMove,
      {passive: true}
    );

    document.addEventListener(
      'mouseup',
      handleUp
    );

    document.addEventListener(
      'touchend',
      handleUp
    );

  }

}


/* =========================
   DRIVE + TURN
   ========================= */

function driveAndTurn() {

  if (x)
    turn(x);

  setTimeout(
    () => drive(y),
    100
  );

}


/* =========================
   THROTTLE
   ========================= */

let lastRan;
let lastFunc;


function throttle(func, limit = 150) {

  const context = this;
  const args = arguments;


  if (!lastRan) {

    func.apply(context, args);

    lastRan = Date.now();

  }

  else {

    clearTimeout(lastFunc);

    lastFunc =
      setTimeout(
        function() {

          if (
            (Date.now() - lastRan)
            >= limit
          ) {

            func.apply(
              context,
              args
            );

            lastRan =
              Date.now();

          }

        },
        limit -
        (Date.now() - lastRan)
      );

  }

}
